name: Bug report
description: Report a reproducible bug in WaveShift TTS Engine
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private media, R2 URLs, or raw production task payloads.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps to reproduce using sanitized data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.10.14"
  - type: input
    id: ffmpeg
    attributes:
      label: FFmpeg version
  - type: input
    id: gpu
    attributes:
      label: GPU/CUDA details
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
