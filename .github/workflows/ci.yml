name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-compile:
    name: Python compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Python sources
        run: python -m compileall api.py app.py config.py launcher.py orchestrator.py core utils
